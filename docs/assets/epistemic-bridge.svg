<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bridgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1012" />
      <stop offset="50%" stop-color="#11181B" />
      <stop offset="100%" stop-color="#152124" />
    </linearGradient>

    <!-- Pulsing Connector Gradients -->
    <linearGradient id="bridgeFlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#5CCFBE" />
    </linearGradient>

    <linearGradient id="bridgeFlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5CCFBE" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <pattern id="bridgeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#192528" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>

    <filter id="bridgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* 1. Calm, Slow Data Packet Conduits */
      .anim-flow-1 {
        stroke-dasharray: 8 24;
        animation: flowPacket 3.5s linear infinite;
      }
      .anim-flow-2 {
        stroke-dasharray: 8 24;
        animation: flowPacket 4.2s linear infinite;
      }
      @keyframes flowPacket {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }

      /* 2. Soft, Calm Beacon Glows (No scale jitter) */
      .anim-obs-ping { animation: softBeacon 3s ease-in-out infinite alternate; }
      .anim-inf-ping { animation: softBeacon 3.5s ease-in-out infinite alternate 0.5s; }
      .anim-unk-ping { animation: softBeacon 4s ease-in-out infinite alternate 1s; }
      @keyframes softBeacon {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, .anim-flow-1, .anim-flow-2, .anim-obs-ping, .anim-inf-ping, .anim-unk-ping {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="240" rx="14" fill="url(#bridgeBg)" stroke="#26363A" stroke-width="1.5" />
  <rect width="900" height="240" rx="14" fill="url(#bridgeGrid)" />

  <!-- Title / Ledger Header -->
  <g transform="translate(30, 26)">
    <text font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">
      THREE KINDS OF STATEMENT
    </text>
    <text x="600" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#5CCFBE">
      PRINCIPLE: SHOW EVIDENCE • LABEL INFERENCE • ADMIT UNKNOWN
    </text>
  </g>

  <!-- Scanning Light Pulse across Bridge -->
  <line x1="0" y1="50" x2="0" y2="215" stroke="#72EBD9" stroke-width="1" class="anim-bridge-scanline" />

  <!-- TIER 1: OBSERVED (Left Column) -->
  <g transform="translate(30, 50)">
    <rect width="250" height="165" rx="8" fill="#10181A" stroke="#1E3A4C" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="#13232C" />
    
    <!-- LED Marker -->
    <circle cx="16" cy="16" r="4.5" fill="#38BDF8" class="anim-obs-ping" />
    <text x="28" y="20" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      1. OBSERVED
    </text>
    <text x="235" y="20" text-anchor="end" font-family="-apple-system, sans-serif" font-size="9" fill="#38BDF8">
      Empirical Facts
    </text>

    <!-- Items -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#BAC6C2" transform="translate(14, 52)">
      <text x="0" y="0"><tspan fill="#38BDF8">●</tspan> Committed Git Blobs</text>
      <text x="0" y="20"><tspan fill="#38BDF8">●</tspan> Function AST Syntax Nodes</text>
      <text x="0" y="40"><tspan fill="#38BDF8">●</tspan> Exact Line:Col Spans (EV-xxx)</text>
      <text x="0" y="60"><tspan fill="#38BDF8">●</tspan> Guard / Throw / Return Exits</text>
      <text x="0" y="80"><tspan fill="#38BDF8">●</tspan> Companion Test Declarations</text>
      <text x="0" y="98" fill="#5F757A">// Ground truth directly extracted</text>
    </g>
  </g>

  <!-- CONNECTOR 1: OBSERVED -> INFERRED -->
  <g>
    <path d="M 280 132 L 335 132" fill="none" stroke="#1E3A4C" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 280 132 L 335 132" fill="none" stroke="url(#bridgeFlow1)" stroke-width="2.5" class="anim-flow-1" filter="url(#bridgeGlow)" />
    <!-- Connector Tag -->
    <g transform="translate(290, 110)">
      <rect width="36" height="15" rx="3" fill="#0C2025" stroke="#194852" stroke-width="0.8" />
      <text x="18" y="10.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" fill="#72EBD9">RULES</text>
    </g>
  </g>

  <!-- TIER 2: INFERRED (Center Column) -->
  <g transform="translate(335, 50)">
    <rect width="250" height="165" rx="8" fill="#10191B" stroke="#1D4B44" stroke-width="1.5" />
    <rect width="250" height="32" rx="8" fill="#112A26" />
    
    <!-- LED Marker -->
    <circle cx="16" cy="16" r="4.5" fill="#5CCFBE" class="anim-inf-ping" />
    <text x="28" y="20" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      2. INFERRED
    </text>
    <text x="235" y="20" text-anchor="end" font-family="-apple-system, sans-serif" font-size="9" fill="#5CCFBE">
      Rule Deductions
    </text>

    <!-- Items -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#BAC6C2" transform="translate(14, 52)">
      <text x="0" y="0"><tspan fill="#5CCFBE">◆</tspan> Syntactic Proximity Heuristics</text>
      <text x="0" y="20"><tspan fill="#5CCFBE">◆</tspan> <tspan fill="#6FE3D1" font-weight="700">STRONG</tspan> : Changed Test Calls It</text>
      <text x="0" y="40"><tspan fill="#5CCFBE">◆</tspan> <tspan fill="#BAC6C2" font-weight="700">WEAK</tspan> : Same File or Range</text>
      <text x="0" y="60"><tspan fill="#5CCFBE">◆</tspan> <tspan fill="#FBBF24" font-weight="700">UNCERTAIN</tspan> : Reserved, Unclear</text>
      <text x="0" y="80"><tspan fill="#5CCFBE">◆</tspan> <tspan fill="#F87171" font-weight="700">NONE</tspan> : No Related Change</text>
      <text x="0" y="98" fill="#5F757A">// Calibrated rule-based hypotheses</text>
    </g>
  </g>

  <!-- CONNECTOR 2: INFERRED -> UNKNOWN (The Epistemic Boundary) -->
  <g>
    <path d="M 585 132 L 640 132" fill="none" stroke="#483320" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 585 132 L 640 132" fill="none" stroke="url(#bridgeFlow2)" stroke-width="2.5" class="anim-flow-2" filter="url(#bridgeGlow)" />
    <!-- Boundary Pill -->
    <g transform="translate(592, 110)">
      <rect width="42" height="15" rx="3" fill="#2E2010" stroke="#784A12" stroke-width="0.8" />
      <text x="21" y="10.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" fill="#FBBF24">LIMIT</text>
    </g>
  </g>

  <!-- TIER 3: UNKNOWN (Right Column) -->
  <g transform="translate(640, 50)">
    <rect width="230" height="165" rx="8" fill="#161517" stroke="#5A3A16" stroke-width="1.5" />
    <rect width="230" height="32" rx="8" fill="#291C0E" />

    <!-- LED Marker -->
    <circle cx="16" cy="16" r="4.5" fill="#F59E0B" class="anim-unk-ping" />
    <text x="28" y="20" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      3. UNKNOWN
    </text>
    <text x="215" y="20" text-anchor="end" font-family="-apple-system, sans-serif" font-size="9" fill="#F59E0B">
      Hard Limits
    </text>

    <!-- Items -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#BAC6C2" transform="translate(14, 52)">
      <text x="0" y="0"><tspan fill="#F59E0B">▲</tspan> Runtime Test Execution</text>
      <text x="0" y="20"><tspan fill="#F59E0B">▲</tspan> Test Passage / Failure</text>
      <text x="0" y="40"><tspan fill="#F59E0B">▲</tspan> Measured Dynamic Coverage</text>
      <text x="0" y="60"><tspan fill="#F59E0B">▲</tspan> External Caller Behavior</text>
      <text x="0" y="80"><tspan fill="#F59E0B">▲</tspan> Defect or Bug Causation</text>
      <text x="0" y="98" fill="#6B5C45">// Never claimed without execution</text>
    </g>
  </g>
</svg>
