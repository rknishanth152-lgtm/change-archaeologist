<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="digBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F11" />
      <stop offset="50%" stop-color="#101719" />
      <stop offset="100%" stop-color="#141E21" />
    </linearGradient>

    <!-- Code Block Background -->
    <linearGradient id="codeBlockBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121A1D" />
      <stop offset="100%" stop-color="#0E1517" />
    </linearGradient>

    <!-- Fault Channel Fill Gradient -->
    <linearGradient id="faultShearGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F58D84" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#F58D84" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4EBEAD" stop-opacity="0.2" />
    </linearGradient>

    <!-- Shaft Conduits -->
    <linearGradient id="shaftStrongGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4EBEAD" />
      <stop offset="100%" stop-color="#72EBD9" />
    </linearGradient>

    <!-- Bedrock Hatch Pattern -->
    <pattern id="bedrockHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#253538" stroke-width="1.2" stroke-opacity="0.6" />
    </pattern>

    <!-- Subtle Cartographic Grid Pattern -->
    <pattern id="digGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162225" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="verdigrisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* 1. Calm, Elegant Data Signal Traveling Down Shaft 1 */
      .anim-shaft-signal {
        stroke-dasharray: 12 120;
        animation: shaftFlow 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes shaftFlow {
        0% { stroke-dashoffset: 132; opacity: 0.2; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }

      /* 2. Soft Breathing on the Geological Fault Boundary */
      .anim-fault-pulse {
        animation: faultBreathe 3.6s ease-in-out infinite alternate;
      }
      @keyframes faultBreathe {
        0% { stroke-opacity: 0.5; fill-opacity: 0.12; }
        100% { stroke-opacity: 0.9; fill-opacity: 0.22; }
      }

      /* 3. Status Indicator Subtle Pulse */
      .anim-beacon-strong {
        animation: beaconStrong 2.6s ease-in-out infinite;
      }
      @keyframes beaconStrong {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #4EBEAD); }
      }

      /* 4. Bedrock Boundary Gentle Pulse */
      .anim-bedrock-rule {
        animation: bedrockPulse 4s ease-in-out infinite alternate;
      }
      @keyframes bedrockPulse {
        0% { stroke-opacity: 0.5; }
        100% { stroke-opacity: 0.9; }
      }

      /* Accessibility Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .anim-shaft-signal, .anim-fault-pulse, .anim-beacon-strong, .anim-bedrock-rule {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="440" rx="12" fill="url(#digBg)" />
  <rect width="900" height="440" rx="12" fill="url(#digGrid)" />
  <rect width="898" height="438" x="1" y="1" rx="11" fill="none" stroke="#253539" stroke-width="1" stroke-opacity="0.6" />

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(24, 26)">
    <circle cx="6" cy="6" r="3.5" fill="#4EBEAD" />
    <text x="18" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">
      THE DIG — EXCAVATION CROSS-SECTION
    </text>

    <!-- Context Meta Pill -->
    <g transform="translate(430, -3)">
      <rect width="422" height="20" rx="4" fill="#111B1E" stroke="#1D2A2E" stroke-width="0.8" />
      <text x="12" y="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#7E9491">
        TARGET: <tspan fill="#86DDCF" font-weight="700">calculateDiscount()</tspan> in src/order.ts
      </text>
      <text x="286" y="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#94A3B8">
        REV: <tspan fill="#E2E8F0">9a8bf4e</tspan> → <tspan fill="#86DDCF">a8265d8</tspan>
      </text>
    </g>
  </g>

  <line x1="24" y1="42" x2="876" y2="42" stroke="#1E2C30" stroke-width="0.8" />

  <!-- ==================== CODE STRATA (TOP HALF) ==================== -->

  <!-- COLUMN 1: BASE Strata (Left) -->
  <g transform="translate(24, 54)">
    <rect width="340" height="156" rx="8" fill="url(#codeBlockBg)" stroke="#223236" stroke-width="1" />
    <!-- Column Title -->
    <rect width="340" height="24" rx="8" fill="#131D20" />
    <rect x="0" y="16" width="340" height="8" fill="#131D20" />
    <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
      YOUR CODE, BEFORE • BASE (9a8bf4e)
    </text>

    <!-- Code Lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#64748B" transform="translate(14, 40)">
      <text x="0" y="0"><tspan fill="#475569">L10</tspan>  const baseRate = 0.05;</text>
      <text x="0" y="16"><tspan fill="#475569">L11</tspan>  if (!customer) return 0;</text>
      <text x="0" y="32"><tspan fill="#475569">L12</tspan>  // VIP discount validation</text>
      
      <!-- Removed Lines Highlight -->
      <g transform="translate(-6, 44)">
        <rect x="0" y="0" width="324" height="28" rx="3" fill="#2E1719" stroke="#5C2227" stroke-width="0.8" />
        <text x="6" y="12" fill="#FCA5A5"><tspan fill="#EF4444">-</tspan> L14 if (!customer.isVerified) {</text>
        <text x="6" y="23" fill="#FCA5A5"><tspan fill="#EF4444">-</tspan> L15   throw new AuthError();</text>
      </g>

      <text x="0" y="86"><tspan fill="#475569">L16</tspan>  return total * baseRate;</text>
      <text x="0" y="100"><tspan fill="#475569">L17</tspan> }</text>
    </g>
  </g>

  <!-- COLUMN 2: HEAD Strata (Right) -->
  <g transform="translate(536, 54)">
    <rect width="340" height="156" rx="8" fill="url(#codeBlockBg)" stroke="#223236" stroke-width="1" />
    <!-- Column Title -->
    <rect width="340" height="24" rx="8" fill="#131D20" />
    <rect x="0" y="16" width="340" height="8" fill="#131D20" />
    <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" fill="#86DDCF" letter-spacing="0.8">
      YOUR CODE, AFTER • HEAD (a8265d8)
    </text>

    <!-- Code Lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#64748B" transform="translate(14, 40)">
      <text x="0" y="0"><tspan fill="#475569">L10</tspan>  const baseRate = 0.05;</text>
      <text x="0" y="16"><tspan fill="#475569">L11</tspan>  if (!customer) return 0;</text>
      <text x="0" y="32"><tspan fill="#475569">L12</tspan>  // VIP discount validation</text>
      
      <!-- Pinch Marker (Where lines were removed) -->
      <g transform="translate(-6, 44)">
        <rect x="0" y="0" width="324" height="18" rx="3" fill="#102022" stroke="#1D4341" stroke-width="0.8" stroke-dasharray="3 3" />
        <text x="8" y="12" fill="#5CCFBE" font-size="7.5">[GUARD CLAUSE DROPPED IN HEAD]</text>
      </g>

      <text x="0" y="76"><tspan fill="#475569">L14</tspan>  return total * baseRate;</text>
      <text x="0" y="90"><tspan fill="#475569">L15</tspan> }</text>
      <text x="0" y="104" fill="#4B6065">... [18 lines unchanged] ...</text>
    </g>
  </g>

  <!-- ==================== CENTRAL FAULT CHANNEL ==================== -->
  <!-- Fault Polygon connecting lines 14-15 of BASE to line 14 of HEAD -->
  <g>
    <!-- Polygon spanning from Left Column x=364 to Right Column x=536 -->
    <polygon points="364,142 536,146 536,156 364,170" fill="url(#faultShearGrad)" stroke="#F58D84" stroke-width="1.2" class="anim-fault-pulse" />
    
    <!-- Fault Anchor in Center of Channel -->
    <circle cx="450" cy="154" r="3.5" fill="#F87171" />
    
    <!-- Fault Pill Label (Floats cleanly in central channel) -->
    <g transform="translate(390, 106)">
      <rect width="120" height="20" rx="4" fill="#181315" stroke="#4A1E24" stroke-width="0.8" />
      <circle cx="9" cy="10" r="2.5" fill="#F87171" />
      <text x="18" y="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" font-weight="700" fill="#FCA5A5">
        FAULT: REMOVED
      </text>
    </g>
  </g>

  <!-- ==================== DATUM RULE DIVIDER ==================== -->
  <g transform="translate(24, 226)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#1E2C30" stroke-width="0.8" />
    <rect x="0" y="-8" width="220" height="16" rx="3" fill="#0C1416" />
    <text x="6" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">
      TESTS TOUCHED IN THIS RANGE
    </text>
  </g>

  <!-- ==================== DRILLED SHAFTS (CONDUITS) ==================== -->
  <!-- Shaft 1 (STRONG): Originates at Central Fault (450, 154) and curves smoothly down to Test Card 1 (250, 260) -->
  <g>
    <!-- Background Guide Track -->
    <path d="M 450 154 C 450 200, 250 210, 250 256" fill="none" stroke="#1B3835" stroke-width="2.5" />
    <!-- Active Conduit -->
    <path d="M 450 154 C 450 200, 250 210, 250 256" fill="none" stroke="url(#shaftStrongGrad)" stroke-width="2" />
    <!-- Traveling Data Pulse Bead -->
    <path d="M 450 154 C 450 200, 250 210, 250 256" fill="none" stroke="#C2FBF3" stroke-width="3" class="anim-shaft-signal" />

    <!-- Shaft Status Badge (Positioned in open channel whitespace) -->
    <g transform="translate(305, 196)">
      <rect width="94" height="18" rx="4" fill="#0E2421" stroke="#1B594F" stroke-width="0.8" />
      <circle cx="8" cy="9" r="2.5" fill="#4EBEAD" class="anim-beacon-strong" />
      <text x="16" y="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" font-weight="700" fill="#86DDCF">
        STRONG SHAFT
      </text>
    </g>
  </g>

  <!-- Shaft 2 (NONE): Originates at Central Fault (450, 154) and curves down to Card 2, ending above bedrock -->
  <g>
    <path d="M 450 154 C 450 200, 650 210, 650 256" fill="none" stroke="#3D2912" stroke-width="1.8" stroke-dasharray="4 4" />
    <g transform="translate(500, 196)">
      <rect width="90" height="18" rx="4" fill="#1E170C" stroke="#483313" stroke-width="0.8" />
      <circle cx="8" cy="9" r="2.5" fill="#F59E0B" />
      <text x="16" y="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" font-weight="700" fill="#FBBF24">
        NONE SHAFT
      </text>
    </g>
  </g>

  <!-- ==================== TEST CARDS (BOTTOM HALF) ==================== -->

  <!-- Card 1: Strong Correlation Companion Test -->
  <g transform="translate(80, 256)">
    <rect width="340" height="100" rx="8" fill="#0E1B1D" stroke="#1D4D47" stroke-width="1.2" />
    <!-- Card Header -->
    <rect width="340" height="24" rx="8" fill="#132628" />
    <rect x="0" y="16" width="340" height="8" fill="#132628" />
    <circle cx="12" cy="12" r="3" fill="#4EBEAD" class="anim-beacon-strong" />
    <text x="22" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700" fill="#E2E8F0">
      tests/order.test.ts • describe(&apos;calculateDiscount&apos;)
    </text>

    <!-- Card Assertions -->
    <g transform="translate(12, 36)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">
      <rect x="0" y="0" width="316" height="34" rx="3" fill="#131F21" stroke="#1F363A" stroke-width="0.7" />
      <text x="8" y="14" fill="#F87171">− L42: expect(calculateDiscount(c)).toBe(0)</text>
      <text x="8" y="27" fill="#4EBEAD">+ L42: expect(calculateDiscount(c)).toBe(10)</text>
      
      <text x="2" y="48" fill="#86DDCF" font-weight="600">
        CORRELATION: STRONG <tspan fill="#64748B" font-weight="400">(Direct syntactic reference to modified guard)</tspan>
      </text>
    </g>
  </g>

  <!-- Card 2: Unmodified Test / Hazard Check -->
  <g transform="translate(480, 256)">
    <rect width="340" height="100" rx="8" fill="#15151A" stroke="#3D3222" stroke-width="1.2" />
    <rect width="340" height="24" rx="8" fill="#201C14" />
    <rect x="0" y="16" width="340" height="8" fill="#201C14" />
    <circle cx="12" cy="12" r="3" fill="#F59E0B" />
    <text x="22" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700" fill="#E2E8F0">
      tests/auth.test.ts • describe(&apos;authCheck&apos;)
    </text>

    <g transform="translate(12, 36)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">
      <rect x="0" y="0" width="316" height="34" rx="3" fill="#181717" stroke="#2B271E" stroke-width="0.7" />
      <text x="8" y="14" fill="#94A3B8">  L58: expect(authCheck).toHaveBeenCalled()</text>
      <text x="8" y="27" fill="#64748B">[0 assertion mutations observed in companion test]</text>
      
      <text x="2" y="48" fill="#F59E0B" font-weight="600">
        CORRELATION: NONE <tspan fill="#64748B" font-weight="400">(Test file touched but assertion left unchanged)</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== BEDROCK STRATUM (BOTTOM FOUNDATION) ==================== -->
  <g transform="translate(0, 380)">
    <!-- Hatching Background -->
    <rect width="900" height="60" fill="url(#bedrockHatch)" />
    <!-- Boundary Amber Dotted Line -->
    <line x1="0" y1="0" x2="900" y2="0" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="6 4" class="anim-bedrock-rule" />
    
    <!-- Bedrock Warning Label Badge -->
    <g transform="translate(24, 16)">
      <rect width="852" height="26" rx="4" fill="#101518" stroke="#253539" stroke-width="0.8" />
      <circle cx="14" cy="13" r="3" fill="#F59E0B" />
      <text x="26" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#BAC6C2" letter-spacing="0.8">
        BEDROCK: <tspan fill="#F59E0B" font-weight="700">WHAT STATIC ANALYSIS CANNOT SEE</tspan> — RUNTIME TEST PASSAGE, COVERAGE &amp; DEFECT CAUSATION
      </text>
      <text x="836" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#4B6065" text-anchor="end">
        SHAFTS NEVER ENTER BEDROCK
      </text>
    </g>
  </g>
</svg>
