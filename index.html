<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Archaeologist</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Local-first deterministic AST structural change and test correlation explorer" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("change-archaeologist-theme");
        } catch (e) {}
        var prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/viewer/main.tsx"></script>
  </body>
</html>
