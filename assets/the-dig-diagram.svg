<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="digBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1214" />
      <stop offset="50%" stop-color="#121A1D" />
      <stop offset="100%" stop-color="#162326" />
    </linearGradient>

    <linearGradient id="rockGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182427" />
      <stop offset="100%" stop-color="#131B1E" />
    </linearGradient>

    <linearGradient id="faultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F58D84" />
      <stop offset="50%" stop-color="#6FE3D1" />
      <stop offset="100%" stop-color="#5CCFBE" />
    </linearGradient>

    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CCFBE" />
      <stop offset="100%" stop-color="#86DDCF" />
    </linearGradient>

    <!-- Bedrock Hatch Pattern -->
    <pattern id="digBedrockHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#253538" stroke-width="1.2" stroke-opacity="0.6" />
    </pattern>

    <!-- Subtle Cartographic Grid Pattern -->
    <pattern id="digGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1B272A" stroke-width="0.6" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="shaftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feGaussianBlur stdDeviation="2" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* 1. Fault Line Seismic Travel */
      .anim-fault-seismic {
        stroke-dasharray: 20 80;
        animation: faultSeismic 3.2s linear infinite;
      }
      @keyframes faultSeismic {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }

      /* 2. Shaft Laser Drill Energy Flow */
      .anim-shaft-drill {
        stroke-dasharray: 12 18;
        animation: shaftFlow 2.4s linear infinite;
      }
      @keyframes shaftFlow {
        from { stroke-dashoffset: 30; }
        to { stroke-dashoffset: 0; }
      }

      /* 3. Excavation Horizon Scanline Sweep */
      .anim-excavation-sweep {
        animation: digScanner 6s ease-in-out infinite alternate;
      }
      @keyframes digScanner {
        0% { transform: translateY(75px); opacity: 0.2; }
        50% { opacity: 0.85; filter: drop-shadow(0 0 4px #5CCFBE); }
        100% { transform: translateY(270px); opacity: 0.2; }
      }

      /* 4. Pulse on Fault Anchor Node */
      .anim-fault-node {
        animation: faultNodePulse 2s ease-in-out infinite alternate;
      }
      @keyframes faultNodePulse {
        0% { transform: scale(0.9); opacity: 0.7; }
        100% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #F58D84); }
      }

      /* 5. Pulse on Assertion Target Node */
      .anim-assertion-node {
        animation: assertNodePulse 2.4s ease-in-out infinite alternate;
      }
      @keyframes assertNodePulse {
        0% { transform: scale(0.9); opacity: 0.7; }
        100% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #72EBD9); }
      }

      /* 6. Bedrock Static Boundary Beacon */
      .anim-bedrock-beacon {
        animation: bedrockPulse 4s ease-in-out infinite;
      }
      @keyframes bedrockPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.95; stroke: #F59E0B; }
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, .anim-fault-seismic, .anim-shaft-drill, .anim-excavation-sweep,
        .anim-fault-node, .anim-assertion-node, .anim-bedrock-beacon {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="330" rx="14" fill="url(#digBg)" stroke="#26363A" stroke-width="1.5" />
  <rect width="900" height="330" rx="14" fill="url(#digGrid)" />

  <!-- Top Instrument Header Bar -->
  <g transform="translate(0, 0)">
    <rect width="900" height="42" rx="14" fill="#0E1618" stroke="#1F2C2F" stroke-width="1" />
    <circle cx="28" cy="21" r="5" fill="#5CCFBE" filter="url(#shaftGlow)" />
    <text x="44" y="25" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      THE DIG — EXCAVATION CROSS-SECTION
    </text>

    <!-- Context Meta Pill -->
    <g transform="translate(420, 10)">
      <rect width="456" height="22" rx="4" fill="#141E21" stroke="#253538" stroke-width="1" />
      <text x="12" y="15" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#7E9491">
        TARGET: <tspan fill="#5CCFBE" font-weight="700">calculateDiscount()</tspan> in src/order.ts
      </text>
      <text x="310" y="15" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#94A3B8">
        REV: <tspan fill="#E2E8F0">9a8bf4e</tspan> → <tspan fill="#5CCFBE">a8265d8</tspan>
      </text>
    </g>
  </g>

  <!-- Moving Excavation Laser Scanner Horizon -->
  <line x1="20" y1="0" x2="880" y2="0" stroke="#72EBD9" stroke-width="1" class="anim-excavation-sweep" />

  <!-- COLUMN 1: BASE Strata (Left) -->
  <g transform="translate(30, 60)">
    <rect width="230" height="205" rx="8" fill="url(#rockGrad1)" stroke="#27373A" stroke-width="1" />
    <!-- Header -->
    <rect width="230" height="26" rx="8" fill="#131B1E" />
    <text x="14" y="17" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="1">
      LAYER I : BASE (9a8bf4e)
    </text>
    
    <!-- Code Lines / Strata -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#64748B" transform="translate(12, 45)">
      <text x="0" y="0"><tspan fill="#475569">L10</tspan>  const baseRate = 0.05;</text>
      <text x="0" y="16"><tspan fill="#475569">L11</tspan>  if (!customer) return 0;</text>
      <text x="0" y="32"><tspan fill="#475569">L12</tspan>  // VIP discount checks</text>
      
      <!-- Fault Line AST Mutation: Safety Check Removed -->
      <g transform="translate(-4, 44)">
        <rect x="0" y="0" width="214" height="34" rx="4" fill="#2E1719" stroke="#A02019" stroke-width="1" stroke-opacity="0.8" />
        <text x="6" y="14" fill="#F87171"><tspan fill="#EF4444">-</tspan> L14 if (!customer.isVerified) {</text>
        <text x="6" y="27" fill="#F87171"><tspan fill="#EF4444">-</tspan> L15   throw new AuthError();</text>
      </g>

      <text x="0" y="98"><tspan fill="#475569">L16</tspan>  return total * baseRate;</text>
      <text x="0" y="114"><tspan fill="#475569">L17</tspan> }</text>
      <text x="0" y="132" fill="#4B6065">... [18 lines compressed] ...</text>
    </g>
  </g>

  <!-- COLUMN 2: HEAD Strata (Center-Left) -->
  <g transform="translate(290, 60)">
    <rect width="230" height="205" rx="8" fill="url(#rockGrad1)" stroke="#27373A" stroke-width="1" />
    <!-- Header -->
    <rect width="230" height="26" rx="8" fill="#131B1E" />
    <text x="14" y="17" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700" fill="#5CCFBE" letter-spacing="1">
      LAYER II : HEAD (a8265d8)
    </text>

    <!-- Code Lines / Strata -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#64748B" transform="translate(12, 45)">
      <text x="0" y="0"><tspan fill="#475569">L10</tspan>  const baseRate = 0.05;</text>
      <text x="0" y="16"><tspan fill="#475569">L11</tspan>  if (!customer) return 0;</text>
      <text x="0" y="32"><tspan fill="#475569">L12</tspan>  // VIP discount checks</text>

      <!-- Pinched Fault Destination -->
      <g transform="translate(-4, 44)">
        <rect x="0" y="0" width="214" height="22" rx="4" fill="#1A272A" stroke="#255550" stroke-width="1" stroke-dasharray="3 3" />
        <text x="6" y="15" fill="#5CCFBE">[GUARD CLAUSE REMOVED IN HEAD]</text>
      </g>

      <text x="0" y="86"><tspan fill="#475569">L14</tspan>  return total * baseRate;</text>
      <text x="0" y="102"><tspan fill="#475569">L15</tspan> }</text>
      <text x="0" y="120" fill="#4B6065">... [18 lines compressed] ...</text>
    </g>
  </g>

  <!-- SEISMIC FAULT CONNECTOR (Between BASE & HEAD) -->
  <g>
    <!-- Background track -->
    <path d="M 256 166 C 272 166, 276 153, 290 153" fill="none" stroke="#2E3C40" stroke-width="2" stroke-dasharray="3 3" />
    <!-- Active Animated Seismic Pulse -->
    <path d="M 256 166 C 272 166, 276 153, 290 153" fill="none" stroke="url(#faultGrad)" stroke-width="2.5" class="anim-fault-seismic" filter="url(#shaftGlow)" />
    <!-- Fault Node Marker -->
    <circle cx="256" cy="166" r="4.5" fill="#F87171" class="anim-fault-node" />
    <circle cx="290" cy="153" r="4" fill="#5CCFBE" />
  </g>

  <!-- COLUMN 3: COMPANION TEST CORRELATIONS (Right) -->
  <g transform="translate(580, 60)">
    <rect width="290" height="205" rx="8" fill="url(#rockGrad1)" stroke="#27373A" stroke-width="1" />
    <!-- Header -->
    <rect width="290" height="26" rx="8" fill="#131B1E" />
    <text x="14" y="17" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      TEST SHAFT : tests/order.test.ts
    </text>

    <!-- Test Assertions Strata -->
    <g transform="translate(14, 42)">
      <!-- Assertion Block 1: STRONG CORRELATION -->
      <g transform="translate(0, 0)">
        <rect width="262" height="48" rx="6" fill="#102523" stroke="#1B6359" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#5CCFBE" />
        <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#6FE3D1">
          SHAFT #1 : STRONG CORRELATION
        </text>
        <text x="14" y="34" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" fill="#94A3B8">
          L42: expect(calculateDiscount(c)).toBe(0)
        </text>
      </g>

      <!-- Assertion Block 2: UNMODIFIED / NONE CORRELATION -->
      <g transform="translate(0, 58)">
        <rect width="262" height="48" rx="6" fill="#1A181C" stroke="#483438" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#F59E0B" />
        <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#FBBF24">
          SHAFT #2 : NONE (UNMODIFIED TEST)
        </text>
        <text x="14" y="34" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" fill="#94A3B8">
          L58: expect(authCheck).toHaveBeenCalled()
        </text>
      </g>

      <!-- Open Ground / Uncorrelated Note -->
      <text x="6" y="132" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" fill="#4D6267">
        [PROBE: 0 companion test mutations observed]
      </text>
    </g>
  </g>

  <!-- DRILLED CORRELATION SHAFTS (Connecting Fault to Tests) -->
  <g>
    <!-- Shaft 1: Strong Correlation (Fault to Test 1) -->
    <path d="M 290 153 C 400 130, 480 115, 580 115" fill="none" stroke="#255550" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 290 153 C 400 130, 480 115, 580 115" fill="none" stroke="url(#shaftGrad)" stroke-width="2.5" class="anim-shaft-drill" filter="url(#shaftGlow)" />
    <circle cx="580" cy="115" r="4.5" fill="#72EBD9" class="anim-assertion-node" />

    <!-- Shaft Tag Pill -->
    <g transform="translate(385, 118)">
      <rect width="90" height="18" rx="4" fill="#0C2E2A" stroke="#165C53" stroke-width="1" />
      <text x="45" y="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#72EBD9">
        STRONG LINK
      </text>
    </g>

    <!-- Shaft 2: None Correlation (Drilled into open ground) -->
    <path d="M 290 153 C 380 175, 460 215, 550 215" fill="none" stroke="#483236" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.65" />
    <circle cx="550" cy="215" r="3.5" fill="#F87171" opacity="0.8" />
  </g>

  <!-- BEDROCK STRATUM: WHAT STATIC ANALYSIS CANNOT SEE (Bottom) -->
  <g transform="translate(0, 276)">
    <rect width="900" height="54" rx="0" fill="url(#digBedrockHatch)" />
    <line x1="0" y1="0" x2="900" y2="0" stroke="#F59E0B" stroke-width="1.5" class="anim-bedrock-beacon" stroke-dasharray="6 3" />
    
    <!-- Bedrock Warning Label -->
    <g transform="translate(30, 16)">
      <rect width="840" height="24" rx="4" fill="#131719" stroke="#2B3639" stroke-width="1" />
      <text x="420" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#BAC6C2" letter-spacing="1">
        BEDROCK: <tspan fill="#F59E0B" font-weight="700">WHAT STATIC ANALYSIS CANNOT SEE</tspan> — RUNTIME TEST PASSAGE, COVERAGE &amp; DEFECT CAUSATION
      </text>
    </g>
  </g>
</svg>
