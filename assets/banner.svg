<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F11" />
      <stop offset="50%" stop-color="#10171A" />
      <stop offset="100%" stop-color="#141F22" />
    </linearGradient>

    <!-- Refined Verdigris Title Gradient -->
    <linearGradient id="verdigrisTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5CCFBE" />
      <stop offset="100%" stop-color="#86DDCF" />
    </linearGradient>

    <!-- Geological Strata Layer Gradients -->
    <linearGradient id="strataGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141E21" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A282C" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="strataGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1517" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#142023" stop-opacity="0.5" />
    </linearGradient>

    <!-- Pill Badge Background -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C2926" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#103632" stop-opacity="0.6" />
    </linearGradient>

    <!-- Precision Coordinate Grid Pattern -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#172427" stroke-width="0.6" stroke-opacity="0.7" />
      <circle cx="0" cy="0" r="0.8" fill="#24373B" />
    </pattern>

    <!-- Bedrock Hatching Pattern -->
    <pattern id="bedrockHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F2D30" stroke-width="1.2" stroke-opacity="0.6" />
    </pattern>

    <style>
      /* 1. Ultra-Slow, Calm Optical Theodolite Rotation (Origin: 145px, 130px) */
      .anim-survey-outer {
        transform-origin: 145px 130px;
        animation: spinClockwise 48s linear infinite;
      }
      .anim-survey-inner {
        transform-origin: 145px 130px;
        animation: spinCounter 36s linear infinite;
      }
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* 2. Calm, Slow Geological Fault Signal Pulse */
      .anim-fault-pulse {
        stroke-dasharray: 40 220;
        animation: faultTravel 4.5s ease-in-out infinite;
      }
      @keyframes faultTravel {
        0% { stroke-dashoffset: 260; opacity: 0.15; }
        30% { opacity: 0.9; }
        70% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.15; }
      }

      /* 3. Subtle Status Glow */
      .anim-badge-dot {
        animation: badgeGlow 3s ease-in-out infinite alternate;
      }
      @keyframes badgeGlow {
        0% { opacity: 0.6; }
        100% { opacity: 1; filter: drop-shadow(0 0 3px #5CCFBE); }
      }

      /* Accessibility Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .anim-survey-outer, .anim-survey-inner, .anim-fault-pulse, .anim-badge-dot {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Canvas Plate -->
  <rect width="900" height="280" rx="14" fill="url(#bgGrad)" stroke="#223337" stroke-width="1.2" />
  <rect width="900" height="280" rx="14" fill="url(#archGrid)" />

  <!-- Geological Strata Waves (The Subsurface Layers) -->
  <path d="M 0 165 Q 220 188 450 168 T 900 178 L 900 280 L 0 280 Z" fill="url(#strataGrad1)" />
  <path d="M 0 218 Q 260 238 520 214 T 900 228 L 900 280 L 0 280 Z" fill="url(#strataGrad2)" />
  <path d="M 0 252 L 900 252 L 900 280 L 0 280 Z" fill="url(#bedrockHatch)" />
  <line x1="0" y1="252" x2="900" y2="252" stroke="#2B3C40" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Geological Fault Line (Left Section) -->
  <path d="M 190 20 L 155 120 L 175 190 L 140 270" fill="none" stroke="#213337" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.6" />
  <path d="M 190 20 L 155 120 L 175 190 L 140 270" fill="none" stroke="#5CCFBE" stroke-width="2" class="anim-fault-pulse" />

  <!-- Excavation Depth Coordinates (Left Border) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#4B6064" letter-spacing="1">
    <text x="30" y="55">DEPTH 0.0m [SURFACE]</text>
    <line x1="22" y1="52" x2="26" y2="52" stroke="#4B6064" stroke-width="0.8" />
    <text x="30" y="115">LAYER I [BASE: 9a8bf4e]</text>
    <line x1="22" y1="112" x2="26" y2="112" stroke="#4B6064" stroke-width="0.8" />
    <text x="30" y="175">LAYER II [HEAD: a8265d8]</text>
    <line x1="22" y1="172" x2="26" y2="172" stroke="#5CCFBE" stroke-width="0.8" opacity="0.6" />
    <text x="30" y="240">BEDROCK [STATIC LIMIT]</text>
    <line x1="22" y1="237" x2="26" y2="237" stroke="#4B6064" stroke-width="0.8" />
  </g>

  <!-- Left Emblem: The Forensic Optical Survey Reticle (Center at 145, 130) -->
  <g>
    <!-- Outer Rotating Survey Ring -->
    <g class="anim-survey-outer">
      <circle cx="145" cy="130" r="46" fill="none" stroke="#1D2E32" stroke-width="0.8" stroke-dasharray="4 6" />
      <circle cx="145" cy="130" r="40" fill="none" stroke="#273C41" stroke-width="0.8" stroke-dasharray="1 7" />
    </g>

    <!-- Inner Counter-Rotating Reticle Ring -->
    <g class="anim-survey-inner">
      <circle cx="145" cy="130" r="32" fill="#0F1719" stroke="#2D4347" stroke-width="1.2" stroke-dasharray="6 4" />
    </g>

    <!-- Fixed Theodolite Crosshairs -->
    <line x1="97" y1="130" x2="110" y2="130" stroke="#4EBEAD" stroke-width="1.2" opacity="0.75" />
    <line x1="180" y1="130" x2="193" y2="130" stroke="#4EBEAD" stroke-width="1.2" opacity="0.75" />
    <line x1="145" y1="82" x2="145" y2="95" stroke="#4EBEAD" stroke-width="1.2" opacity="0.75" />
    <line x1="145" y1="165" x2="145" y2="178" stroke="#4EBEAD" stroke-width="1.2" opacity="0.75" />

    <!-- Hexagon Stratum Crystal -->
    <polygon points="145,110 162,120 162,140 145,150 128,140 128,120" fill="#131E21" stroke="#3D565C" stroke-width="1.2" />
    
    <!-- Fault Mutation Wedge -->
    <path d="M 134 125 L 156 125 L 160 135 L 138 135 Z" fill="#0D3A35" stroke="#5CCFBE" stroke-width="1" />

    <!-- Center Emitter Core -->
    <circle cx="145" cy="130" r="3.5" fill="#72EBD9" />
  </g>

  <!-- Main Information Block -->
  <g transform="translate(230, 0)">
    <!-- Pill Badge: FORENSIC AST STRATIGRAPHY & CORRELATION -->
    <g transform="translate(0, 42)">
      <rect width="330" height="22" rx="4" fill="url(#badgeGrad)" stroke="#17574F" stroke-width="0.8" />
      <circle cx="10" cy="11" r="2.5" fill="#5CCFBE" class="anim-badge-dot" />
      <text x="20" y="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700" fill="#86DDCF" letter-spacing="1.2">
        FORENSIC AST STRATIGRAPHY &amp; CORRELATION
      </text>
    </g>

    <!-- Main Title: CHANGE ARCHAEOLOGIST -->
    <g transform="translate(0, 112)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="1.5">
        <tspan fill="#F1F5F9">CHANGE </tspan>
        <tspan fill="url(#verdigrisTitleGrad)">ARCHAEOLOGIST</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Excavates structural code changes across Git history and correlates companion tests.
    </text>

    <!-- Epistemic Ground Truth Strip -->
    <g transform="translate(0, 178)">
      <!-- Card: OBSERVED -->
      <g transform="translate(0, 0)">
        <rect width="180" height="30" rx="5" fill="#111A1D" stroke="#1E2E32" stroke-width="0.8" />
        <circle cx="14" cy="15" r="3.5" fill="#38BDF8" />
        <text x="25" y="18.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#F1F5F9" letter-spacing="0.5">OBSERVED</text>
        <text x="96" y="18.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">AST Spans</text>
      </g>

      <!-- Card: INFERRED -->
      <g transform="translate(192, 0)">
        <rect width="180" height="30" rx="5" fill="#111A1D" stroke="#1E2E32" stroke-width="0.8" />
        <circle cx="14" cy="15" r="3.5" fill="#5CCFBE" />
        <text x="25" y="18.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#F1F5F9" letter-spacing="0.5">INFERRED</text>
        <text x="94" y="18.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Correlations</text>
      </g>

      <!-- Card: UNKNOWN -->
      <g transform="translate(384, 0)">
        <rect width="180" height="30" rx="5" fill="#111A1D" stroke="#1E2E32" stroke-width="0.8" />
        <circle cx="14" cy="15" r="3.5" fill="#F59E0B" />
        <text x="25" y="18.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#F1F5F9" letter-spacing="0.5">UNKNOWN</text>
        <text x="94" y="18.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">Boundaries</text>
      </g>
    </g>

    <!-- Technical Trust Markers at Base -->
    <g transform="translate(0, 242)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#526A6F" letter-spacing="0.5">
      <text x="0" y="0">
        <tspan fill="#4EBEAD">✓</tspan> 100% Local-First
        <tspan dx="16" fill="#4EBEAD">✓</tspan> Deterministic AST
        <tspan dx="16" fill="#4EBEAD">✓</tspan> Subprocess Sandboxed
        <tspan dx="16" fill="#4EBEAD">✓</tspan> Zero Telemetry
      </text>
    </g>
  </g>

  <!-- Right Decorative Telemetry Column -->
  <g transform="translate(850, 40)" opacity="0.7">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#1F3035" stroke-width="0.8" stroke-dasharray="2 3" />
    <circle cx="0" cy="30" r="2.5" fill="#2E4449" />
    <circle cx="0" cy="90" r="2.5" fill="#4EBEAD" opacity="0.8" />
    <circle cx="0" cy="150" r="2.5" fill="#2E4449" />
  </g>
</svg>
